<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALTCHA Rate Limiter & Whitelist Tester</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.12);
      --success: #10b981;
      --forbidden: #8b5cf6;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 980px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.04), 0 1px 2px -1px rgba(0, 0, 0, 0.04);
      margin-bottom: 18px;
    }

    .controls-top {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .controls-bottom {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 14px;
      align-items: end;
    }

    @media (max-width: 768px) {
      .controls-top, .controls-bottom {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn {
      background: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 11px 22px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 42px;
    }

    .btn:hover:not(:disabled) {
      background: #1e293b;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    @media (max-width: 820px) {
      .stats-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 520px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .stat-card {
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .stat-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.85rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    .val-total { color: #0f172a; }
    .val-200 { color: var(--success); }
    .val-403 { color: var(--forbidden); }
    .val-429 { color: var(--danger); }
    .val-err { color: var(--warning); }

    /* Progress Bar */
    .progress-wrap {
      background: #e2e8f0;
      border-radius: 999px;
      height: 10px;
      width: 100%;
      overflow: hidden;
      display: flex;
      margin-bottom: 12px;
    }

    .bar-success {
      background: var(--success);
      height: 100%;
      width: 0%;
      transition: width 0.15s ease-out;
    }

    .bar-forbidden {
      background: var(--forbidden);
      height: 100%;
      width: 0%;
      transition: width 0.15s ease-out;
    }

    .bar-danger {
      background: var(--danger);
      height: 100%;
      width: 0%;
      transition: width 0.15s ease-out;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Logs Section */
    .logs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .logs-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-pill {
      font-size: 0.75rem;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 2px 8px;
      border-radius: 999px;
      color: var(--text-muted);
    }

    .logs-container {
      background: #f8fafc;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      height: 360px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .log-item {
      display: grid;
      grid-template-columns: 55px 75px 65px 1fr;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      border-radius: 6px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-left: 3px solid transparent;
      animation: fadeIn 0.15s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-2px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .log-item.status-200 {
      border-left-color: var(--success);
      background: #f0fdf4;
    }

    .log-item.status-403 {
      border-left-color: var(--forbidden);
      background: #f5f3ff;
    }

    .log-item.status-429 {
      border-left-color: var(--danger);
      background: #fef2f2;
    }

    .log-item.status-error {
      border-left-color: var(--warning);
      background: #fffbeb;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.72rem;
    }

    .badge-200 { background: #dcfce7; color: #166534; }
    .badge-403 { background: #ede9fe; color: #6d28d9; }
    .badge-429 { background: #fee2e2; color: #991b1b; }
    .badge-err { background: #fef3c7; color: #92400e; }

    .log-idx { color: var(--text-muted); }
    .log-time { color: #94a3b8; font-size: 0.76rem; }
    .log-detail {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #334155;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>ALTCHA Bruteforce & Whitelist Tester</h1>
      <p>Simulasi lonjakan request untuk menguji proteksi rate limiter IP dan validasi domain whitelist</p>
    </header>

    <!-- Controls Card -->
    <div class="card">
      <div class="controls-top">
        <div class="form-group">
          <label for="targetUrl">Target Endpoint</label>
          <input type="text" id="targetUrl" value="altcha.partamayasa.my.id/challenge" placeholder="altcha.partamayasa.my.id/challenge">
        </div>
        <div class="form-group">
          <label for="originDomain">Domain Pengujian (X-Origin)</label>
          <input type="text" id="originDomain" value="partamayasa.my.id" placeholder="partamayasa.my.id">
        </div>
      </div>
      <div class="controls-bottom">
        <div class="form-group">
          <label for="reqCount">Total Request</label>
          <input type="number" id="reqCount" value="90" min="1" max="300">
        </div>
        <div class="form-group">
          <label for="delayMs">Interval (ms)</label>
          <input type="number" id="delayMs" value="100" min="0" max="1000">
        </div>
        <button id="btnStart" class="btn" onclick="startTest()">
          <svg id="btnIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          <span id="btnText">Mulai Pengujian</span>
        </button>
      </div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-title">Request Terkirim</span>
        <span id="valTotal" class="stat-value val-total">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-title">200 (Diizinkan)</span>
        <span id="val200" class="stat-value val-200">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-title">403 (Ditolak)</span>
        <span id="val403" class="stat-value val-403">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-title">429 (Terblokir)</span>
        <span id="val429" class="stat-value val-429">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-title">Lainnya / Error</span>
        <span id="valErr" class="stat-value val-err">0</span>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-wrap">
      <div id="barSuccess" class="bar-success"></div>
      <div id="barForbidden" class="bar-forbidden"></div>
      <div id="barDanger" class="bar-danger"></div>
    </div>
    <div class="progress-meta">
      <span id="progressText">Menunggu pengujian dimulai</span>
      <span id="rateLimitStatus">Status: Normal</span>
    </div>

    <!-- Logs Card -->
    <div class="card">
      <div class="logs-header">
        <div class="logs-title">
          <span>Aktivitas Request Realtime</span>
          <span id="logBadgeCount" class="badge-pill">0 logs</span>
        </div>
        <button onclick="clearLogs()" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem;">Bersihkan Log</button>
      </div>
      <div id="logsContainer" class="logs-container">
        <!-- Dynamic logs injected here -->
      </div>
    </div>
  </div>

  <script>
    let isTesting = false;
    let count200 = 0;
    let count403 = 0;
    let count429 = 0;
    let countErr = 0;

    const btnStart = document.getElementById('btnStart');
    const btnText = document.getElementById('btnText');
    const valTotal = document.getElementById('valTotal');
    const val200 = document.getElementById('val200');
    const val403 = document.getElementById('val403');
    const val429 = document.getElementById('val429');
    const valErr = document.getElementById('valErr');
    const barSuccess = document.getElementById('barSuccess');
    const barForbidden = document.getElementById('barForbidden');
    const barDanger = document.getElementById('barDanger');
    const progressText = document.getElementById('progressText');
    const rateLimitStatus = document.getElementById('rateLimitStatus');
    const logsContainer = document.getElementById('logsContainer');
    const logBadgeCount = document.getElementById('logBadgeCount');
    const targetUrlInput = document.getElementById('targetUrl');
    const originDomainInput = document.getElementById('originDomain');

    // Hapus tampilan https:// atau http:// dari input
    function stripProtocol(val) {
      if (!val) return '';
      return val.trim().replace(/^https?:\/\//i, '');
    }

    // Pastikan request ke server tetap memakai https://
    function ensureProtocol(val) {
      if (!val) return '';
      val = val.trim();
      if (!val.startsWith('http://') && !val.startsWith('https://')) {
        return 'https://' + val;
      }
      return val;
    }

    // Bersihkan otomatis jika user mengetik/paste url berprotokol
    [targetUrlInput, originDomainInput].forEach(input => {
      if (!input) return;
      input.addEventListener('blur', () => {
        input.value = stripProtocol(input.value);
      });
      input.addEventListener('input', () => {
        if (/^https?:\/\//i.test(input.value)) {
          input.value = stripProtocol(input.value);
        }
      });
    });

    function getCustomHeaders() {
      const headers = {};
      const rawOrigin = stripProtocol(originDomainInput ? originDomainInput.value : '');
      if (rawOrigin) {
        headers['X-Origin'] = ensureProtocol(rawOrigin);
      }
      return headers;
    }

    function clearLogs() {
      logsContainer.innerHTML = '';
      logBadgeCount.textContent = '0 logs';
    }

    function addLog(index, status, latency, message) {
      const item = document.createElement('div');
      item.className = `log-item status-${status === 200 ? '200' : (status === 403 ? '403' : (status === 429 ? '429' : 'error'))}`;
      
      let badgeClass = 'badge-err';
      let badgeText = status || 'Error';

      if (status === 200) {
        badgeClass = 'badge-200';
        badgeText = '200';
      } else if (status === 403) {
        badgeClass = 'badge-403';
        badgeText = '403';
      } else if (status === 429) {
        badgeClass = 'badge-429';
        badgeText = '429';
      }

      item.innerHTML = `
        <span class="log-idx">#${index}</span>
        <span class="badge ${badgeClass}">${badgeText}</span>
        <span class="log-time">${latency}ms</span>
        <span class="log-detail" title="${escapeHtml(message)}">${escapeHtml(message)}</span>
      `;

      logsContainer.appendChild(item);
      logsContainer.scrollTop = logsContainer.scrollHeight;
      logBadgeCount.textContent = `${index} logs`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, (m) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[m]);
    }

    async function sendRequest(index, targetUrl, headers) {
      const start = performance.now();
      try {
        const res = await fetch(targetUrl, {
          method: 'GET',
          cache: 'no-store',
          headers: headers
        });
        const latency = Math.round(performance.now() - start);
        let bodyText = '';
        try {
          const json = await res.json();
          bodyText = JSON.stringify(json);
        } catch {
          bodyText = await res.text();
        }

        return {
          index,
          status: res.status,
          latency,
          message: bodyText || `HTTP ${res.status}`
        };
      } catch (err) {
        const latency = Math.round(performance.now() - start);
        return {
          index,
          status: 0,
          latency,
          message: err.message || 'Network / CORS error'
        };
      }
    }

    async function startTest() {
      if (isTesting) return;

      const rawTarget = stripProtocol(targetUrlInput ? targetUrlInput.value : '');
      const targetUrl = ensureProtocol(rawTarget);

      if (targetUrlInput) targetUrlInput.value = rawTarget;
      if (originDomainInput) originDomainInput.value = stripProtocol(originDomainInput.value);

      const total = parseInt(document.getElementById('reqCount').value, 10) || 90;
      const delay = parseInt(document.getElementById('delayMs').value, 10) || 100;
      const headers = getCustomHeaders();

      isTesting = true;
      btnStart.disabled = true;
      btnText.textContent = 'Menjalankan Tes';
      clearLogs();

      count200 = 0;
      count403 = 0;
      count429 = 0;
      countErr = 0;

      valTotal.textContent = `0/${total}`;
      val200.textContent = '0';
      val403.textContent = '0';
      val429.textContent = '0';
      valErr.textContent = '0';
      barSuccess.style.width = '0%';
      barForbidden.style.width = '0%';
      barDanger.style.width = '0%';
      progressText.textContent = `Menjalankan request 1 sampai ${total}`;
      rateLimitStatus.textContent = 'Status: Berjalan';
      rateLimitStatus.style.color = 'var(--text-muted)';

      for (let i = 1; i <= total; i++) {
        const res = await sendRequest(i, targetUrl, headers);

        if (res.status === 200) {
          count200++;
        } else if (res.status === 403) {
          count403++;
          rateLimitStatus.textContent = 'Ditolak: Domain tidak ada dalam whitelist (403)';
          rateLimitStatus.style.color = 'var(--forbidden)';
        } else if (res.status === 429) {
          count429++;
          rateLimitStatus.textContent = 'Peringatan: Rate limit aktif! Request diblokir (429)';
          rateLimitStatus.style.color = 'var(--danger)';
        } else {
          countErr++;
        }

        // Update UI
        valTotal.textContent = `${i}/${total}`;
        val200.textContent = count200;
        val403.textContent = count403;
        val429.textContent = count429;
        valErr.textContent = countErr;

        const pct200 = (count200 / total) * 100;
        const pct403 = (count403 / total) * 100;
        const pct429 = (count429 / total) * 100;
        barSuccess.style.width = `${pct200}%`;
        barForbidden.style.width = `${pct403}%`;
        barDanger.style.width = `${pct429}%`;

        addLog(i, res.status, res.latency, res.message);

        if (delay > 0 && i < total) {
          await new Promise((r) => setTimeout(r, delay));
        }
      }

      isTesting = false;
      btnStart.disabled = false;
      btnText.textContent = 'Uji Ulang';
      
      const summaryParts = [];
      if (count200) summaryParts.push(`${count200} diizinkan (200)`);
      if (count403) summaryParts.push(`${count403} ditolak whitelist (403)`);
      if (count429) summaryParts.push(`${count429} diblokir rate limit (429)`);
      if (countErr) summaryParts.push(`${countErr} error`);
      progressText.textContent = `Pengujian Selesai: ${summaryParts.join(', ')}`;
    }
  </script>
</body>
</html>
