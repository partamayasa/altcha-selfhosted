  <title>Sign In | ALTCHA Manager</title>

  <!--begin::Theme Init (prevents flash of incorrect theme on load, #6043)-->
  <script>
    (() => {
      'use strict';
      const root = document.documentElement;

      // Applications with their own theming opt out of AdminLTE's color mode
      // entirely, here as well as in the bundle.
      if (root.getAttribute('data-lte-color-mode') === 'off') {
        return;
      }

      const STORAGE_KEY = 'lte-theme';
      let stored = null;
      try {
        stored = localStorage.getItem(STORAGE_KEY);
      } catch {
        // localStorage may be unavailable (private mode, sandboxed iframe).
      }
      // Mirror the precedence in color-mode.ts: the visitor's stored choice
      // wins, then a theme this page declared itself, then the OS preference.
      const authored = root.getAttribute('data-bs-theme');
      let resolved = 'light';
      if (stored === 'dark' || stored === 'light') {
        resolved = stored;
      } else if (authored === 'dark' || authored === 'light') {
        resolved = authored;
      } else if (globalThis.matchMedia('(prefers-color-scheme: dark)').matches) {
        resolved = 'dark';
      }
      root.setAttribute('data-bs-theme', resolved);
      root.style.colorScheme = resolved;
      // Flag values computed here, so the bundle does not mistake them for a
      // theme the page declared and stop following the OS preference.
      if (resolved !== authored) {
        root.setAttribute('data-lte-theme-resolved', '');
      }
    })();
  </script>
  <!--end::Theme Init-->

<body class="login-page bg-body-secondary">
  <main class="login-box">
    <h1 class="login-logo">
      <a href="./index" id="login-app-logo">ALTCHA Manager</a>
    </h1>
    <!-- /.login-logo -->
    <div class="card card-outline card-primary shadow-sm">
      <div class="card-body login-card-body">
        <p class="login-box-msg">Sign in to ALTCHA Manager</p>

        <div id="loginAlert" class="alert alert-danger d-none py-2 mb-3" style="font-size: 0.88rem;" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          <span id="loginAlertText"></span>
        </div>

        <form id="loginForm" autocomplete="on">
          <label class="visually-hidden" for="loginUsername">Username</label>
          <div class="input-group mb-3">
            <input id="loginUsername" type="text" class="form-control" placeholder="Username" autocomplete="username" required autofocus />
            <div class="input-group-text">
              <span class="bi bi-person-fill"></span>
            </div>
          </div>
          <label class="visually-hidden" for="loginPassword">Password</label>
          <div class="input-group mb-3">
            <input id="loginPassword" type="password" class="form-control" placeholder="Password" autocomplete="current-password" required />
            <div class="input-group-text">
              <span class="bi bi-lock-fill"></span>
            </div>
          </div>

          <!--begin::ALTCHA CAPTCHA-->
          <div class="mb-3">
            <altcha-widget
              id="altcha-widget"
              challengeurl="/api/auth/challenge"
              configuration='{"hideFooter": true}'
              style="--altcha-border-radius: var(--bs-border-radius, 0.375rem); --altcha-border-color: var(--bs-border-color); --altcha-color-border-focus: var(--bs-primary); --altcha-color-base: var(--bs-body-bg); --altcha-color-text: var(--bs-body-color); --altcha-label-color: var(--bs-secondary-color); --altcha-padding: 0.375rem 0.75rem; --altcha-max-width: 100%; width: 100%; display: block;"
            ></altcha-widget>
          </div>
          <!--end::ALTCHA CAPTCHA-->
          <!--begin::Row-->
          <div class="row align-items-center mb-3">
            <div class="col-7">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="rememberMe" checked />
                <label class="form-check-label text-secondary small" for="rememberMe"> Remember Me </label>
              </div>
            </div>
            <!-- /.col -->
            <div class="col-5">
              <button type="submit" id="loginBtn" class="btn btn-primary w-100">
                <span id="loginBtnText">Sign In</span>
                <span id="loginSpinner" class="spinner-border spinner-border-sm d-none ms-1" role="status" aria-hidden="true"></span>
              </button>
            </div>
            <!-- /.col -->
          </div>
          <!--end::Row-->
        </form>
      </div>
      <!-- /.login-card-body -->
    </div>
  </main>
  <!-- /.login-box -->

  <!--begin::App Settings Loader-->
  <script>
    // Fetch app settings from server and apply to title + login logo
    (function () {
      const CACHE_KEY = 'sentinel_app_settings';
      const CACHE_TTL_MS = 60 * 1000;

      function applySettings(settings) {
        if (!settings) return;
        const appName = settings.app_name || 'ALTCHA Manager';
        document.title = 'Sign In | ' + appName;
        const logoEl = document.getElementById('login-app-logo');
        if (logoEl) logoEl.textContent = appName;
      }

      function loadFromCache() {
        try {
          const raw = sessionStorage.getItem(CACHE_KEY);
          if (!raw) return null;
          const { data, ts } = JSON.parse(raw);
          if (Date.now() - ts > CACHE_TTL_MS) return null;
          return data;
        } catch { return null; }
      }

      const cached = loadFromCache();
      if (cached) {
        applySettings(cached);
      } else {
        fetch('/api/sentinel/app-settings')
          .then(r => r.ok ? r.json() : null)
          .then(data => {
            if (data) {
              try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ data, ts: Date.now() })); } catch { }
              applySettings(data);
            }
          })
          .catch(() => { /* keep static fallback title */ });
      }
    })();
  </script>
  <!--end::App Settings Loader-->
  <!--begin::OverlayScrollbars Configure-->
  <script>
    const SELECTOR_SIDEBAR_WRAPPER = '.sidebar-wrapper';
    const Default = {
      scrollbarTheme: 'os-theme-light',
      scrollbarAutoHide: 'leave',
      scrollbarClickScroll: true,
    };
    document.addEventListener('DOMContentLoaded', function () {
      const sidebarWrapper = document.querySelector(SELECTOR_SIDEBAR_WRAPPER);

      // Disable OverlayScrollbars on mobile devices to prevent touch interference
      const isMobile = window.innerWidth <= 992;

      if (
        sidebarWrapper &&
        OverlayScrollbarsGlobal?.OverlayScrollbars !== undefined &&
        !isMobile
      ) {
        OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
          scrollbars: {
            theme: Default.scrollbarTheme,
            autoHide: Default.scrollbarAutoHide,
            clickScroll: Default.scrollbarClickScroll,
          },
        });
      }
    });
  </script>
  <!--end::OverlayScrollbars Configure-->
  <!--begin::Charts follow the colour mode-->
  <script>
    // ApexCharts draws light-theme tooltips and axis text unless told otherwise,
    // which is unreadable in dark mode (#6105). Give it the page's colour mode as
    // a global default before any chart is created — this runs before the chart
    // pages' own scripts — and keep every chart that has a `chart.id` in step
    // when the mode changes (ColorMode, the OS in auto mode, or your own code).
    (() => {
      'use strict';
      const mode = () =>
        document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'dark' : 'light';
      // `Apex` is ApexCharts' global-options object; it must exist before the library loads.
      // theme.mode also sets a dark chart background — keep the card's instead.
      // eslint-disable-next-line unicorn/no-global-object-property-assignment
      globalThis.Apex ||= {};
      const apex = globalThis.Apex;
      apex.theme = { mode: mode() };
      apex.chart = Object.assign(apex.chart || {}, { background: 'transparent' });
      new MutationObserver(() => {
        const next = mode();
        apex.theme = { mode: next };
        const instances = apex._chartInstances || [];
        for (const { chart } of instances) {
          chart.updateOptions({ theme: { mode: next } }, false, false);
        }
      }).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-bs-theme'],
      });
    })();
  </script>
  <!--end::Charts follow the colour mode-->

  <!--begin::Login Logic-->
  <script>
    (function () {
      'use strict';

      // If already logged in, redirect straight to dashboard
      fetch('/api/auth/me', { credentials: 'same-origin' })
        .then(function (res) {
          if (res.ok) {
            window.location.replace('./index');
          }
        })
        .catch(function () {});

      const form = document.getElementById('loginForm');
      const usernameInput = document.getElementById('loginUsername');
      const passwordInput = document.getElementById('loginPassword');
      const alertBox = document.getElementById('loginAlert');
      const alertText = document.getElementById('loginAlertText');
      const submitBtn = document.getElementById('loginBtn');
      const submitText = document.getElementById('loginBtnText');
      const spinner = document.getElementById('loginSpinner');

      function showError(msg) {
        alertText.textContent = msg;
        alertBox.classList.remove('d-none');
      }

      function hideError() {
        alertBox.classList.add('d-none');
        alertText.textContent = '';
      }

      function setLoading(loading) {
        if (loading) {
          submitBtn.disabled = true;
          spinner.classList.remove('d-none');
          submitText.textContent = 'Signing in';
        } else {
          submitBtn.disabled = false;
          spinner.classList.add('d-none');
          submitText.textContent = 'Sign In';
        }
      }

      // Ensure widget matches the exact height and layout of input fields
      function applyWidgetInputStyle() {
        const widget = document.getElementById('altcha-widget');
        if (!widget || !widget.shadowRoot) return;
        if (widget.shadowRoot.querySelector('#compact-input-style')) return;

        const style = document.createElement('style');
        style.id = 'compact-input-style';
        style.textContent = `
          .altcha-main {
            min-height: calc(1.5em + 0.75rem + 2px) !important;
            height: calc(1.5em + 0.75rem + 2px) !important;
            box-sizing: border-box !important;
            display: flex !important;
            align-items: center !important;
            padding: 0.375rem 0.75rem !important;
            border-radius: var(--altcha-border-radius, 0.375rem) !important;
            background-color: var(--altcha-color-base, var(--bs-body-bg)) !important;
            border: 1px solid var(--altcha-border-color, var(--bs-border-color)) !important;
          }
          .altcha-main > div:first-child {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            width: 100% !important;
            height: 100% !important;
          }
          .altcha-checkbox-wrap {
            display: flex !important;
            align-items: center !important;
            gap: 0.5rem !important;
            font-size: 0.95rem !important;
          }
          .altcha-footer {
            display: none !important;
          }
        `;
        widget.shadowRoot.appendChild(style);
      }

      applyWidgetInputStyle();
      const styleInterval = setInterval(applyWidgetInputStyle, 100);
      setTimeout(function () { clearInterval(styleInterval); }, 5000);
      document.addEventListener('DOMContentLoaded', applyWidgetInputStyle);
      window.addEventListener('load', applyWidgetInputStyle);

      let altchaPayloadCache = null;
      const widgetEl = document.getElementById('altcha-widget');
      if (widgetEl) {
        widgetEl.addEventListener('verified', function (e) {
          if (e && e.detail && e.detail.payload) {
            altchaPayloadCache = e.detail.payload;
          }
        });
        widgetEl.addEventListener('statechange', function (e) {
          if (e && e.detail && e.detail.state === 'verified' && e.detail.payload) {
            altchaPayloadCache = e.detail.payload;
          }
        });
      }

      // Helper: get ALTCHA payload value from widget
      function getAltchaPayload() {
        const widget = document.getElementById('altcha-widget');
        if (!widget) return null;
        if (widget.value) return widget.value;
        if (widget.shadowRoot) {
          const hiddenInput = widget.shadowRoot.querySelector('input[type="hidden"]');
          if (hiddenInput && hiddenInput.value) return hiddenInput.value;
        }
        return altchaPayloadCache || null;
      }

      // Helper: reset ALTCHA widget after failed attempt
      function resetAltcha() {
        altchaPayloadCache = null;
        const widget = document.getElementById('altcha-widget');
        if (widget && typeof widget.reset === 'function') {
          widget.reset();
        }
      }

      if (form) {
        form.addEventListener('submit', async function (e) {
          e.preventDefault();
          hideError();

          const username = usernameInput.value.trim();
          const password = passwordInput.value;

          if (!username || !password) {
            showError('Please enter both username and password.');
            return;
          }

          // Check ALTCHA completion
          const altchaPayload = getAltchaPayload();
          if (!altchaPayload) {
            showError('Please complete the CAPTCHA verification before signing in.');
            return;
          }

          setLoading(true);

          try {
            const res = await fetch('/api/auth/login', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              credentials: 'same-origin',
              body: JSON.stringify({ username, password, altcha: altchaPayload }),
            });

            const data = await res.json().catch(function () { return {}; });

            if (res.ok && data.success) {
              if (data.role === 'user') {
                window.location.replace('integration');
              } else {
                window.location.replace('index');
              }
            } else {
              showError(data.error || 'Invalid username or password.');
              passwordInput.value = '';
              passwordInput.focus();
              resetAltcha();
              setLoading(false);
            }
          } catch (err) {
            showError('Connection error. Please try again.');
            resetAltcha();
            setLoading(false);
          }
        });
      }
    })();
  </script>
  <!--end::Login Logic-->

  <!--end::Script-->
</body>
<!--end::Body-->
