<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uji Coba Widget ALTCHA</title>

  <script async defer src="https://cdn.jsdelivr.net/npm/altcha@latest/dist/altcha.min.js" type="module"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f9fafb;
      padding: 20px;
    }

    .container {
      width: fit-content;
      padding: 28px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background-color: #ffffff;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      color: #111827;
      white-space: nowrap;
      font-size: 1.25rem;
    }

    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    altcha-widget {
      --altcha-max-width: 100%;
      --altcha-width: 100%;
      width: 100%;
      margin-bottom: 20px;
      display: block;
    }

    button {
      background-color: #0066cc;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0052a3;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Anti-Spam & Bot Protection</h2>

    <form action="https://captcha.djinggamedia.com/verify" method="POST" target="_blank">

      <altcha-widget challengeurl="https://captcha.djinggamedia.com/challenge" strings='{
          "errorVerificationFailed": "Verification failed."
        }'>
      </altcha-widget>

      <button type="submit">Kirim Verifikasi</button>
    </form>
  </div>

</body>

</html>
