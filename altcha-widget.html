<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uji Coba Widget ALTCHA</title>

  <script src="./altcha.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f3f4f6;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 {
      margin: 0 0 20px;
      text-align: center;
      color: #111827;
      font-size: 1.25rem;
    }

    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    altcha-widget {
      --altcha-max-width: 100%;
      --altcha-width: 100%;
      width: 100%;
      margin-bottom: 20px;
      display: block;
    }

    button {
      background-color: #0066cc;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      width: 100%;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0052a3;
    }

    #status-msg {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Anti-Spam Protection</h2>

    <form action="https://altcha.partamayasa.my.id/verify" method="POST" target="_blank">
      <altcha-widget 
        challenge="https://altcha.partamayasa.my.id/challenge"
        challengeurl="https://altcha.partamayasa.my.id/challenge">
      </altcha-widget>

      <button type="submit">Submit Verification</button>
      <div id="status-msg"></div>
    </form>
  </div>

  <script>
    const widget = document.querySelector('altcha-widget');
    const msg = document.getElementById('status-msg');

    if (widget) {
      widget.addEventListener('error', (e) => {
        msg.style.display = 'block';
        msg.style.color = '#dc2626';
        msg.textContent = 'Error: ' + (e.detail?.error || 'Failed to load verification');
      });

      widget.addEventListener('statechange', (e) => {
        if (e.detail?.state === 'verified') {
          msg.style.display = 'block';
          msg.style.color = '#16a34a';
          msg.textContent = 'Verification completed successfully!';
        }
      });
    }
  </script>

</body>

</html>
